[package]
name = "silk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
silk-ebpf-common = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
aya = "0.13"
aya-obj = "0.2"
bytes = "1"
rand = "0.8"
quinn = { version = "0.11.7", default-features = false, features = ["log", "runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
ring = "0.17"
fst = "0.4"
serde_json = "1"
# VLESS REALITY / uTLS — self-implemented TLS 1.3（直接移植自 ant）
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hex = "0.4"
base64 = "0.22"
brotli-decompressor = "4"
# VLESS XHTTP packet-up / stream-up — hyper h2/h1 客户端（移植自 ant）
hyper = { version = "1", features = ["http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
futures = "0.3"
tokio-stream = "0.1"
tower = { version = "0.5", default-features = false }
redb = "4.4.0"

[features]
# Compiles in the eBPF object built from ../silk-ebpf.
ebpf = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ebpf"))'] }

[dev-dependencies]
# local DoH server for the dnsup tests
hyper = { version = "1", features = ["server", "http1"] }
